project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "slides/*.qmd"
    - "notes/*.qmd"
    - "assignments/*.qmd"

website:
  title: "Introduction to NLP"
  site-url: ""
  description: "Informatica Feminale Summer School — Introduction to Natural Language Processing"
  # TODO: once the GitHub repo exists, add a navbar with a GitHub icon:
  # navbar:
  #   right:
  #     - icon: github
  #       href: ""
  #       text: GitHub

  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
      - href: schedule.qmd
        text: Schedule
      - section: "Slides"
        contents:
          - href: slides/day1.qmd
            text: "Day 1 (full day)"
          - href: slides/day2.qmd
            text: "Day 2 (half day)"
      - section: "Notes"
        contents:
          - href: notes/day1.qmd
            text: "Day 1 (full day)"
          - href: notes/day2.qmd
            text: "Day 2 (half day)"
      - href: assignments/index.qmd
        text: Assignment
      - href: resources.qmd
        text: Resources

  page-footer:
    center: "Introduction to NLP · Informatica Feminale Summer School · Mara Weber"

format:
  html:
    theme: [cosmo, styles/site.scss]
    toc: true
    number-sections: false
    code-copy: true
    code-tools: true

execute:
  freeze: auto
