project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "slides/*.qmd"
    - "notes/*.qmd"
    - "assignments/*.qmd"

website:
  title: "Introduction to NLP"
  site-url: ""
  description: "Informatica Feminale Summer School — Introduction to Natural Language Processing"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
      - href: schedule.qmd
        text: Schedule
      - text: Slides
        menu:
          - href: slides/day1.qmd
            text: "Day 1 (full day): Scraping & Text Preprocessing"
          - href: slides/day2.qmd
            text: "Day 2 (half day): Supervised Learning, Embeddings & LLMs"
      - text: Notes
        menu:
          - href: notes/day1.qmd
            text: "Day 1 (full day): Scraping & Text Preprocessing"
          - href: notes/day2.qmd
            text: "Day 2 (half day): Supervised Learning, Embeddings & LLMs"
      - href: assignments/index.qmd
        text: Assignment
      - href: resources.qmd
        text: Resources
    # right:
    #   - icon: github
    #     href: "" # TODO: fill in once the GitHub repo exists
    #     text: GitHub

  page-footer:
    center: "Introduction to NLP · Informatica Feminale Summer School · Mara Weber"

format:
  html:
    theme: [cosmo, styles/site.scss]
    toc: true
    number-sections: false
    code-copy: true
    code-tools: true

execute:
  freeze: auto
